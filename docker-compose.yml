version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # Redis — Per-Agent Memory Layer
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: agentops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Neo4j — Trust Store & RBAC Graph
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.9-community
    container_name: agentops-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeme_strong_password}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-changeme_strong_password} 'RETURN 1' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Backend — FastAPI + WebSockets
  # ---------------------------------------------------------------------------
  backend:
    image: agentops-backend-fresh:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentops-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://redis:6379/0"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme_strong_password}"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      AZURE_OPENAI_DEPLOYMENT_NAME: "${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4o}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      ENABLE_SEMANTIC_FIREWALL: "${ENABLE_SEMANTIC_FIREWALL:-false}"
      ANOMALY_ZSCORE_THRESHOLD: "${ANOMALY_ZSCORE_THRESHOLD:-4.0}"
      MAX_RECOVERY_ATTEMPTS: "${MAX_RECOVERY_ATTEMPTS:-3}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # for code sandbox execution
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Frontend — React SOC Dashboard (served via Nginx in prod)
  # ---------------------------------------------------------------------------
  frontend:
    image: agentops-frontend-fresh:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000/api"
        VITE_WS_URL: "ws://localhost:8000/ws/dashboard"
    container_name: agentops-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  default:
    name: agentops-mesh-network
